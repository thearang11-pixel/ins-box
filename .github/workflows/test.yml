name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 웹 UI 테스트(FastAPI TestClient)까지 함께 돌리기 위해 웹 의존성도 설치합니다.
      - run: pip install pytest httpx fastapi uvicorn jinja2 python-multipart
      - run: pytest -v
