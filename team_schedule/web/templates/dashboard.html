{% extends "base.html" %}
{% block title %}대시보드 · 팀 일정{% endblock %}
{% block content %}
<h1>대시보드</h1>
<p class="muted">오늘 {{ today }} ({{ weekday }}) 기준</p>

<section class="stats">
  <div class="stat">
    <div class="stat-num">{{ total }}</div>
    <div class="stat-label">전체 일정</div>
  </div>
  <div class="stat">
    <div class="stat-num">{{ upcoming }}</div>
    <div class="stat-label">다가오는 일정</div>
  </div>
  <div class="stat {{ 'warn' if conflicts }}">
    <div class="stat-num">{{ conflicts }}</div>
    <div class="stat-label">겹침/중복</div>
  </div>
</section>

<div class="grid2">
  <section class="card">
    <h2>오늘 일정</h2>
    <pre class="box">{{ daily_text }}</pre>
  </section>
  <section class="card">
    <h2>이번 주 일정</h2>
    <pre class="box">{{ weekly_text }}</pre>
  </section>
</div>

<p><a class="btn" href="/events/new">+ 새 일정 추가</a></p>
{% endblock %}
